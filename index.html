<html lang="en">
<head>

<meta property="og:title" content="Ayman Azer · Senior Product Designer">
<meta property="og:description" content="Design systems, mobile and web product design. Tampa, Florida.">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Ayman Azer</title>
<meta name="description" content="Ayman Azer, Senior Product Designer in Tampa, Florida. Design systems, mobile and web product design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating pill nav over a white canvas; soft grey component cards on a 12-col grid, max 1180px. */
:root{
  --bg:#ffffff;
  --surface:#f2f2f0;
  --surface-2:#e8e8e5;
  --fg:#0c0c0d;
  --muted:#66666c;
  --line:#e3e3df;
  --accent:#0d8bff;      /* the blue of a selection handle */
  --on-accent:#ffffff;
  --stage:#f0f0ee;       /* matches the light ground of captured mockups */
  --pill-bg:rgba(255,255,255,.78);
  --shadow:0 1px 2px rgba(12,12,13,.05),0 10px 30px -12px rgba(12,12,13,.18);
  --ok:#0f8a4b;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-card:22px;
  --tint-amt:13%;        /* how much of each project's hue tints its stage */
  --glow:55%;
  --ease:cubic-bezier(.22,.9,.24,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c;--surface:#161618;--surface-2:#202023;--fg:#f3f3f1;--muted:#9c9ca4;--line:#26262a;
  --accent:#3aa7ff;--on-accent:#06121f;--pill-bg:rgba(22,22,24,.78);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.7);--ok:#3fcf86;--tint-amt:24%;--glow:6%;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c;--surface:#161618;--surface-2:#202023;--fg:#f3f3f1;--muted:#9c9ca4;--line:#26262a;
  --accent:#3aa7ff;--on-accent:#06121f;--pill-bg:rgba(22,22,24,.78);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -12px rgba(0,0,0,.7);--ok:#3fcf86;--tint-amt:24%;--glow:6%;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-weight:500;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,6.6vw,76px);line-height:1.02;letter-spacing:-.035em}
h2{font-size:clamp(28px,3.8vw,44px);line-height:1.08;letter-spacing:-.03em}
h3{font-size:20px;line-height:1.25;letter-spacing:-.015em}
p{margin:0}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--muted);max-width:60ch;line-height:1.55}

/* ---------- Nav ---------- */
.nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;z-index:50;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;view-transition-name:nav}
.pill{pointer-events:auto;background:var(--pill-bg);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:2px;padding:5px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;padding:4px 12px 4px 5px;font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:-.01em}
.logo .mark{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:500;letter-spacing:0}
.links{position:relative}
.links a{position:relative;z-index:1;text-decoration:none;font-size:14px;padding:7px 14px;border-radius:999px;color:var(--muted);transition:color .25s}
.links a[aria-current="page"]{color:var(--fg)}
.links .ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--surface-2);transition:transform .45s var(--spring),width .45s var(--spring)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg);text-decoration:none;transition:background .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:17px;height:17px}
/* sun / moon switch */
.mode{position:relative;display:flex;align-items:center;gap:0;height:36px;padding:3px;border:0;border-radius:999px;background:var(--surface-2);cursor:pointer;margin-left:2px}
.mode span{position:relative;z-index:1;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);transition:color .3s}
.mode svg{width:16px;height:16px}
.mode::before{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .5s var(--spring)}
.mode[aria-checked="true"]::before{transform:translateX(30px)}
.mode[aria-checked="false"] .sun,.mode[aria-checked="true"] .moon{color:var(--fg)}
.mode[aria-checked="false"] .sun svg{animation:spin .6s var(--ease)}
@keyframes spin{from{transform:rotate(-90deg) scale(.6)}}
@media (max-width:640px){
  .logo .name{display:none}.logo{padding:4px 5px}
  .links a.hide-sm{display:none}
  .links a{padding:7px 11px}
  .pill.actions .li{display:none}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;
  text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .35s var(--spring),background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;transition:transform .35s var(--spring)}
.btn:hover svg{transform:translateX(3px)}

/* ---------- Page shell ---------- */
main{padding-top:calc(env(safe-area-inset-top,0px) + 110px);padding-bottom:40px}
section{padding-block:clamp(48px,7vw,96px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sec-head .mono{display:block;margin-bottom:10px}

/* load-in: starts visible, sharpens into place */
.rise{animation:rise .9s var(--ease) both}
@keyframes rise{from{transform:translateY(14px);filter:blur(6px)}to{transform:none;filter:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}.d4{animation-delay:.3s}.d5{animation-delay:.38s}
/* scroll reveal: transform only, never hidden */
.rv{transition:transform .9s var(--ease)}
.rv.pre{transform:translateY(22px)}

/* ---------- Hero ---------- */
.hero{padding-top:clamp(12px,3vw,40px);padding-bottom:clamp(32px,5vw,56px)}
.hero .mono{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{max-width:16ch}
.hero .lead{margin-top:22px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
/* home hero: centered statement, each line shades from muted to ink, words rise in */
.hero.center{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:clamp(24px,6vw,80px);padding-bottom:clamp(40px,6vw,72px)}
.hero.center .lead{margin-inline:auto;text-align:center}
.hero.center .cta{justify-content:center}
.statement{font-size:clamp(38px,6.2vw,82px);line-height:1.02;letter-spacing:-.05em;font-weight:500;max-width:none}
.hero h1.statement{max-width:none}
.statement .ln{display:block}
.statement .w{display:inline-block;color:color-mix(in srgb,var(--fg) var(--k),var(--muted));animation:rise 1s var(--ease) both;animation-delay:calc(var(--i) * 55ms + 80ms)}
/* scroll-shaded paragraph: words go from muted to ink as it scrolls past */
.shade .w{color:var(--muted);transition:color .5s ease}
.shade .w.on{color:var(--fg)}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px 48px}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.intro p{font-size:clamp(20px,2.3vw,28px);line-height:1.4;letter-spacing:-.015em;max-width:34ch}

/* showcase cards (live components) */
.show{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r-card);position:relative;overflow:hidden;min-width:0}
.show .card{aspect-ratio:1/0.92;max-width:100%;display:flex;flex-direction:column}
.card .cap{position:absolute;left:18px;bottom:16px;right:18px;display:flex;justify-content:space-between;gap:8px}
.card .cap span:last-child{color:var(--fg);text-transform:none;letter-spacing:0;font-family:var(--font);font-size:13px}
@media (max-width:900px){.show{grid-template-columns:1fr 1fr}.show .card:last-child{grid-column:1/-1;aspect-ratio:auto;min-height:220px}}
@media (max-width:600px){.show{grid-template-columns:1fr}.show .card{aspect-ratio:auto;min-height:280px}}

/* card A: selection box over components */
.sel-stage{flex:1;display:grid;place-items:center;padding:24px 24px 52px}
.stack{position:relative;display:grid;gap:12px;width:min(230px,100%)}
.ds-btn{height:44px;border-radius:999px;display:grid;place-items:center;font-size:14px;font-weight:500;border:0}
.ds-btn.b1{background:#0b7a55;color:#fff}
.ds-btn.b2{background:#075e41;color:#fff}
.ds-btn.b3{background:var(--surface-2);color:var(--muted)}
.selbox{position:absolute;left:-6px;right:-6px;top:-6px;height:56px;border:1.5px solid var(--accent);border-radius:6px;pointer-events:none;transition:transform .7s var(--spring)}
.selbox i{position:absolute;width:7px;height:7px;background:var(--bg);border:1.5px solid var(--accent);border-radius:1px}
.selbox i:nth-child(1){left:-4px;top:-4px}.selbox i:nth-child(2){right:-4px;top:-4px}.selbox i:nth-child(3){left:-4px;bottom:-4px}.selbox i:nth-child(4){right:-4px;bottom:-4px}
.selbox b{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font:500 10.5px/1 var(--mono);background:var(--accent);color:var(--on-accent);padding:4px 6px;border-radius:4px;white-space:nowrap}
.selbox em{position:absolute;left:-1px;top:-21px;font:500 10.5px/1 var(--mono);font-style:normal;color:var(--accent);white-space:nowrap}

/* card B: contrast checker */
.contrast{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px 22px 56px}
.sample{border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:end;transition:background .5s var(--ease),color .5s var(--ease)}
.sample strong{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.sample small{font-family:var(--mono);font-size:11px;opacity:.85}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font:500 11px/1 var(--mono);padding:6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:inline-flex;gap:5px;align-items:center}
.badge.pass{color:var(--ok)}.badge.fail{color:var(--muted);text-decoration:line-through}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .3s var(--spring)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg);transform:scale(1.08)}

/* card C: marquee of teams */
.marq{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 0 56px;overflow:hidden;
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:8px;width:max-content;animation:scroll 34s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:40s}
.chip{white-space:nowrap;font-size:14px;padding:9px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ---------- Project cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(40px,5vw,64px) 24px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.pcard{text-decoration:none;display:flex;flex-direction:column;gap:16px;min-width:0}
.pcard .cover{aspect-ratio:5/4}
.pcard .meta{display:flex;justify-content:space-between;align-items:start;gap:16px}
.pcard h3{font-size:18px;margin-bottom:2px}
.pcard p{color:var(--muted);font-size:14.5px;line-height:1.45}
.pcard .tags{justify-content:flex-end;flex:none;max-width:48%;margin:0}
@media (max-width:520px){.pcard .meta{flex-direction:column;gap:10px}.pcard .tags{justify-content:flex-start;max-width:none}}
.arrow{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .45s var(--spring),background .25s,color .25s,border-color .25s}
.arrow svg{width:15px;height:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;white-space:nowrap}

/* covers: every project sits on its own tinted stage, the work floats on top */
.cover{--t:#888;background:color-mix(in srgb,var(--t) var(--tint-amt),var(--bg));border-radius:var(--r-card);overflow:hidden;position:relative;max-width:100%;isolation:isolate;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--t) 14%,transparent)}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,#fff var(--glow),transparent),transparent 60%)}
.cover .lift{position:absolute;transition:transform .9s var(--ease)}
.win{left:9%;right:9%;top:11%;bottom:-6%;border-radius:12px 12px 0 0;overflow:hidden;background:var(--bg);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 30px 60px -24px rgba(10,14,30,.45),0 0 0 1px rgba(10,14,30,.08)}
.win .bar{height:26px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.win .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.win img{width:100%;height:calc(100% - 26px);object-fit:cover;object-position:var(--pos,left top)}
.cardshot{left:8%;right:8%;top:9%;bottom:9%;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -26px rgba(10,14,30,.5),0 0 0 1px rgba(10,14,30,.06)}
.cardshot img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,center)}
.phones{inset:0;display:flex;align-items:center;justify-content:center;gap:4%;padding:9% 6% 0}
.phones .ph{flex:0 0 28%;height:auto;align-self:flex-start}
.phones .ph:nth-child(2){margin-top:5%}
.pair{inset:0;display:flex;align-items:flex-start;justify-content:center;gap:5%;padding:7% 6% 0}
.pair img{height:108%;width:auto;border-radius:16px;box-shadow:0 26px 50px -24px rgba(0,0,0,.45)}
.pair img:nth-child(2){margin-top:6%}
.cover .go{position:absolute;right:16px;bottom:16px;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--fg);display:grid;place-items:center;
  box-shadow:0 6px 20px -8px rgba(0,0,0,.35);transition:transform .45s var(--spring)}
.cover .go svg{width:16px;height:16px;transform:rotate(-45deg)}
.pcard:hover .lift{transform:translateY(-8px)}
.pcard:hover .win{transform:translateY(-8px) scale(1.01)}
.pcard:hover .go{transform:scale(1.12) rotate(45deg)}
.ph{aspect-ratio:9/19.5;background:#0c0c0d;border-radius:clamp(14px,2.4vw,30px);padding:clamp(4px,.5vw,7px);box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:clamp(10px,1.9vw,24px)}

/* ---------- Approach / quotes ---------- */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.feature{background:var(--surface);border-radius:var(--r-card);padding:26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.feature .ico{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;margin-bottom:8px;border:1px solid var(--line)}
.feature .ico svg{width:19px;height:19px}
.feature p{color:var(--muted);font-size:15px}
.quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.quotes{grid-template-columns:1fr}}
blockquote{margin:0;background:var(--surface);border-radius:var(--r-card);padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
blockquote p{font-size:19px;line-height:1.45;letter-spacing:-.01em}
.recs{display:block;columns:3 300px;column-gap:16px}
.recs blockquote{break-inside:avoid;margin:0 0 16px;justify-content:flex-start}
.recs blockquote p{font-size:16px;line-height:1.55;letter-spacing:0}
blockquote footer{display:flex;gap:12px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font:500 13px/1 var(--mono);flex:none}
blockquote footer small{display:block;color:var(--muted);font-size:13px;line-height:1.35}

/* ---------- CTA band + footer ---------- */
.band{background:var(--fg);color:var(--bg);border-radius:28px;padding:clamp(32px,6vw,64px);display:flex;justify-content:space-between;align-items:end;gap:28px;flex-wrap:wrap;overflow:hidden;position:relative}
.band h2{max-width:14ch}
.band .btn.primary{background:var(--bg);color:var(--fg)}
.band .btn.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.band .mono{color:color-mix(in srgb,var(--bg) 60%,transparent);display:block;margin-bottom:14px}
footer.site{border-top:1px solid var(--line);margin-top:40px;padding-block:28px 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
footer.site nav{display:flex;gap:18px;flex-wrap:wrap}
footer.site a{text-decoration:none}footer.site a:hover{color:var(--fg)}

/* ---------- Work page filter ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pcard.gone{display:none}

/* ---------- Project page ---------- */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:14px;margin-bottom:28px}
.back:hover{color:var(--fg)}.back svg{width:15px;height:15px}

.steps{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:6px}
.steps button{width:100%;text-align:left;background:transparent;border:0;border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;color:var(--muted);transition:background .25s,color .25s}

.dstage{display:grid;place-items:center;min-height:420px;position:relative}

.tap{position:absolute;right:-8px;top:18%;font:500 11px/1 var(--mono);background:var(--fg);color:var(--bg);padding:7px 9px;border-radius:999px;pointer-events:none}

/* token playground */
.tp-ctrls{display:grid;gap:16px;margin-top:22px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl > span{font-size:14px}
.tp{--b:#0b7a55;--b2:#075e41;--rad:999px;--pad:12px;--gap:12px;--tb:#ffffff;--tf:#151517;--tm:#6a6a70;--tl:#e3e3df;--ts:#f2f2f0;
  background:var(--tb);color:var(--tf);border-radius:20px;padding:24px;display:grid;gap:var(--gap);border:1px solid var(--tl);transition:background .4s,color .4s,gap .4s var(--spring)}
.tp.dark{--tb:#141416;--tf:#f2f2f0;--tm:#9c9ca4;--tl:#2a2a2e;--ts:#1e1e21}
.tp *{transition:border-radius .45s var(--spring),padding .4s var(--spring),background .4s,color .4s,border-color .4s}
.tp .lbl{font:500 11px/1 var(--mono);color:var(--tm);letter-spacing:.05em;text-transform:uppercase}
.tp .in{border:1px solid var(--tl);background:var(--ts);border-radius:min(var(--rad),12px);padding:var(--pad) 14px;font-size:14px;color:var(--tm)}
.tp .b{border:0;border-radius:var(--rad);padding:var(--pad) 18px;font-size:14px;font-weight:500;cursor:pointer}
.tp .b.p{background:var(--b);color:#fff}
.tp .b.s{background:transparent;color:var(--b);box-shadow:inset 0 0 0 1.5px var(--b)}
.tp.dark .b.s{color:#fff;box-shadow:inset 0 0 0 1.5px #ffffff55}
.tp .b.d{background:var(--ts);color:var(--tm);cursor:not-allowed}
.tp .row{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tp .tog{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tp .sw2{width:42px;height:24px;border-radius:999px;background:var(--b);position:relative;border:0;cursor:pointer}
.tp .sw2::after{content:"";position:absolute;top:3px;left:21px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .4s var(--spring)}
.tp .sw2[aria-checked="false"]{background:var(--tl)}
.tp .sw2[aria-checked="false"]::after{left:3px}
.tokens{margin-top:14px;font:12px/1.7 var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow-x:auto;white-space:nowrap}
.tokens b{color:var(--fg);font-weight:500}

/* funnel */
.funnel{display:grid;gap:14px;width:100%}

.fr:nth-child(2) .fill{background:color-mix(in srgb,var(--fg) 70%,var(--surface))}

/* ---------- About ---------- */
.about-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:start}

.tl .what strong{font-weight:500;font-size:17px}
.tl .what p{color:var(--muted);font-size:15px;margin-top:4px;max-width:62ch}

.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Contact ---------- */
.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.ccard.wide{grid-column:1/-1;background:var(--fg);color:var(--bg)}
.ccard.wide .mono{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.ccard .v.big{font-size:clamp(24px,4.4vw,48px);letter-spacing:-.035em;font-weight:500}
.small-btn.primary{background:var(--bg);color:var(--fg);border-color:transparent}
.ccard.wide .small-btn:not(.primary){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.band-mail{margin-top:14px;font-size:18px;color:color-mix(in srgb,var(--bg) 70%,transparent);user-select:all}
@media (max-width:820px){.contact-grid{grid-template-columns:1fr}}
.ccard{background:var(--surface);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ccard .v{font-size:22px;letter-spacing:-.02em;user-select:all;word-break:break-word}

.small-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;cursor:pointer;text-decoration:none;transition:transform .35s var(--spring)}
.small-btn:hover{transform:translateY(-2px)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,calc(100% + 40px));opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:70;transition:transform .5s var(--spring),opacity .3s}
.toast:empty{display:none}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- Case study (long-form project content) ---------- */
.cs{margin-top:clamp(48px,7vw,88px);display:grid;gap:clamp(48px,7vw,88px)}
.cs-sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px 48px;padding-top:clamp(24px,3.5vw,36px);border-top:1px solid var(--line)}
@media (max-width:860px){.cs-sec{grid-template-columns:1fr;gap:14px}}
.cs-sec > .mono{padding-top:7px}
.cs-num{color:var(--accent)}
.cs-txt{min-width:0;display:grid;gap:20px;align-content:start}
.cs h3{font-size:clamp(24px,2.6vw,32px);line-height:1.15;letter-spacing:-.025em;font-weight:500;max-width:26ch;margin:0}
.cs h4{font-size:18px;line-height:1.3;font-weight:500;letter-spacing:-.01em;margin:0}
.cs p{margin:0}
.cs-lead{font-size:clamp(19px,2vw,23px);line-height:1.5;letter-spacing:-.015em;max-width:38em}
.cs-kicker,.cs-eyebrow{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.cs-eyebrow{color:var(--muted);margin-bottom:-8px}
.cs-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:17px;line-height:1.55;max-width:66ch}
.cs-list li{position:relative;padding-left:22px}
.cs-list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.cs-list ul{list-style:none;margin:10px 0 2px;padding:0;display:grid;gap:8px;color:var(--muted)}
.cs-list ul li::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;border-radius:50%}
.hl{color:var(--accent);font-weight:500}
.cs-split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,4vw,48px);align-items:start;min-width:0}
@media (max-width:1000px){.cs-split{grid-template-columns:1fr}}
.cs-fig{margin:0;background:var(--stage);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;max-width:100%}
.cs-fig img{display:block;width:100%;height:auto;cursor:zoom-in}
.cs-fig--narrow{width:min(340px,100%);justify-self:end;padding:clamp(16px,2.5vw,28px);background:var(--surface)}

.cs-annot{position:relative}

.cs-sub{grid-column:2;display:grid;gap:20px;margin-top:clamp(20px,3vw,32px);padding:clamp(20px,3vw,32px);background:var(--surface);border-radius:var(--r-card);min-width:0}
@media (max-width:860px){.cs-sub{grid-column:1}}
.cs-toc{list-style:none;margin:0;padding:0;columns:2;column-gap:40px}
@media (max-width:700px){.cs-toc{columns:1}}
.cs-toc li{break-inside:avoid}
.cs-toc a{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:16px;line-height:1.4;transition:color .2s,transform .35s var(--spring)}
.cs-toc a span{font:500 13px/1.6 var(--mono);color:var(--accent)}
.cs-toc a:hover{color:var(--accent);transform:translateX(4px)}
.cs-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.cs-cards{grid-template-columns:1fr}}
.cs-card{background:var(--surface);border-radius:var(--r-card);padding:24px;display:grid;gap:8px;align-content:start}
.cs-card h4{color:var(--accent)}
.cs-card p{color:var(--muted);font-size:15.5px;line-height:1.5}
/* token flow diagram */
.cs-flow{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 2px 34px;scrollbar-width:thin}
.cs-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}
.cs-pill{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;border-radius:999px;background:var(--bg);border:1px solid var(--line);
  font:500 14px/1 var(--mono);color:var(--fg);white-space:nowrap}
.cs-step:not(.cs-step--stack) .cs-cap{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%)}
.cs-cap{font:12px/1.3 var(--mono);color:var(--muted);white-space:nowrap}
.cs-step--stack{gap:12px;align-items:stretch}
.cs-step--stack .cs-cap{text-align:center;margin-top:2px}
.cs-anat{display:flex;justify-content:space-around;font:11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cs-arrow{flex:0 0 36px;height:1.5px;background:var(--accent);position:relative;margin:0 6px}
.cs-arrow::after{content:"";position:absolute;right:-1px;top:50%;width:7px;height:7px;border-top:1.5px solid var(--accent);border-right:1.5px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.cs-branch{flex:none;width:56px;height:96px;color:var(--accent);margin-left:6px;overflow:visible}
@media (max-width:700px){
  .cs-flow{flex-direction:column;align-items:flex-start;overflow:visible;padding:4px 0}
  .cs-step:not(.cs-step--stack){flex-direction:row;gap:12px}

  .cs-arrow{flex:0 0 22px;width:1.5px;height:22px;margin:6px 0 6px 20px}
  .cs-arrow::after{right:auto;left:50%;top:auto;bottom:-1px;transform:translateX(-50%) rotate(135deg)}
  .cs-branch{width:40px;height:70px;margin:2px 0 0 4px;transform:rotate(90deg);transform-origin:center}
  .cs-step--stack{align-items:flex-start}
  .cs-anat{justify-content:flex-start;gap:14px}
}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 56px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));opacity:0;transition:opacity .3s}
.lb.in{opacity:1}

/* view transitions */
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:cubic-bezier(.22,.9,.24,1)}

::view-transition-new(root){animation-name:vt-in}
@keyframes vt-out{to{opacity:0;transform:translateY(-10px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(14px)}}
::view-transition-group(hero-cover){animation-duration:.6s;animation-timing-function:cubic-bezier(.22,.9,.24,1)}
::view-transition-group(*){animation-duration:.5s;animation-timing-function:cubic-bezier(.22,.9,.24,1)}
.vt-theme::view-transition-old(root){animation:vt-fade-out .4s ease both}
.vt-theme::view-transition-new(root){animation:vt-fade-in .4s ease both}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .rv.pre{transform:none}
}

function words(t){ return t.split(' ').map(w=>`<span class="w">${w}</span>`).join(' '); }
function cover(p, cls=''){
  const c=p.cover; let inner='';
  if(c.type==='win') inner=`<div class="lift win" style="--pos:${c.pos||'left top'}"><div class="bar"><i></i><i></i><i></i></div><img src="${img(c.src)}" alt="" loading="lazy"></div>`;
  else if(c.type==='card') inner=`<div class="lift cardshot" style="--pos:${c.pos||'center'}"><img src="${img(c.src)}" alt="" loading="lazy"></div>`;
  else if(c.type==='phones') inner=`<div class="lift phones">${c.srcs.map(s=>c.bare?`<img class="bareph" src="${img(s)}" alt="" loading="lazy">`:`<div class="ph"><img src="${img(s)}" alt="" loading="lazy"></div>`).join('')}</div>`;
  else if(c.type==='pair') inner=`<div class="lift pair">${c.srcs.map(s=>`<img src="${img(s)}" alt="" loading="lazy">`).join('')}</div>`;
  return `<div class="cover ${cls}" style="--t:${p.tint}" data-cover="${p.slug}" role="img" aria-label="${p.title} preview">${inner}${cls?'':`<span class="go" aria-hidden="true">${I.arrow}</span>`}</div>`;
}

}

/* ---------------- Router ---------------- */
const app=document.getElementById('app');
let current='home', prevSlug=null, timers=[];
function parse(){const h=(location.hash||'#home').slice(1);return h||'home'}
function view(r){
  if(r.startsWith('p-')){const p=bySlug(r.slice(2)); if(p) return [vProject(p),'work',p];}
  if(r==='work') return [vWork(),'work'];
  if(r==='about') return [vAbout(),'about'];
  if(r==='contact') return [vContact(),'contact'];
  return [vHome(),'home'];
}
function render(){
  timers.forEach(clearInterval); timers=[];
  const r=parse(); const [html,nav,p]=view(r);
  app.innerHTML=html;
  document.querySelectorAll('#links a').forEach(a=>{if(a.dataset.r===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  moveInd();
  document.title = p ? p.title+' · Ayman Azer' : 'Ayman Azer';
  // shared-element naming
  if(p){const h=app.querySelector('.phero'); if(h) h.style.viewTransitionName='hero-cover';}
  else if(prevSlug){const c=app.querySelector(`.pcard[data-slug="${prevSlug}"] .cover`); if(c){c.style.viewTransitionName='hero-cover'; c.closest('.pcard').scrollIntoView({block:'center'}); return after();}}
  window.scrollTo(0,0);
  after();
}
function after(){
  setupReveal(); setupHome(); setupWork(); setupProtos(); setupTokens(); setupFunnel(); setupContact(); setupShade(); setupLightbox(); setupCase();
}
/* words shade in as the paragraph scrolls through the viewport */
function setupShade(){
  const els=[...app.querySelectorAll('.shade')]; if(!els.length) return;
  const tick=()=>els.forEach(el=>{ const ws=el.querySelectorAll('.w'); const r=el.getBoundingClientRect(), vh=innerHeight;
    const p=reduce?1:Math.min(1,Math.max(0,(vh*0.85-r.top)/(r.height+vh*0.35)));
    const n=Math.round(p*ws.length); ws.forEach((w,i)=>w.classList.toggle('on',i<n)); });
  tick(); if(!reduce){ addEventListener('scroll',tick,{passive:true}); const stop=setInterval(()=>{ if(!document.body.contains(els[0])){removeEventListener('scroll',tick);clearInterval(stop)} },1500); }
}
/* full-size image viewer for gallery shots */
/* case study: plain HTML fragment loaded into the project page */
function setupCase(){
  const host=document.getElementById('cs-host'); if(!host) return;
  fetch(host.dataset.src).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); }).then(t=>{
    if(!document.body.contains(host)) return;
    host.innerHTML=t; setupReveal(); setupLightbox();
    host.querySelectorAll('.cs-toc a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); const el=document.getElementById(a.getAttribute('href').slice(1)); if(el) el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); }));
  }).catch(()=>{ host.innerHTML='<p style="color:var(--muted)">The case study could not load. Refresh the page to try again.</p>'; });
}
function setupLightbox(){
  app.querySelectorAll('.gallery .g img, .cs-fig img').forEach(im=>{ if(im.dataset.lb) return; im.dataset.lb=1; im.style.cursor='zoom-in'; im.tabIndex=0; im.setAttribute('role','button');
    const open=()=>{ const lb=document.getElementById('lb'); lb.querySelector('img').src=im.src; lb.querySelector('img').alt=im.alt; lb.querySelector('p').textContent=im.alt; lb.hidden=false; requestAnimationFrame(()=>lb.classList.add('in')); lb.querySelector('button').focus(); };
    im.addEventListener('click',open); im.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open()} }); });
}
function closeLb(){ const lb=document.getElementById('lb'); lb.classList.remove('in'); setTimeout(()=>lb.hidden=true,300); }
document.getElementById('lb').addEventListener('click',e=>{ if(e.target.id==='lb'||e.target.closest('button')) closeLb(); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && !document.getElementById('lb').hidden) closeLb(); });
function navigate(){
  const r=parse();
  const going=r.startsWith('p-')?r.slice(2):null;
  const clear=()=>document.querySelectorAll('[data-cover]').forEach(e=>{if(!e.classList.contains('phero'))e.style.viewTransitionName=''});
  if(document.startViewTransition && !reduce){
    const t=document.startViewTransition(()=>{render(); prevSlug=going||prevSlug;});
    t.finished.finally(clear);
  } else { render(); prevSlug=going||prevSlug; }
  if(!going && !r.startsWith('p-')) setTimeout(()=>{ if(!parse().startsWith('p-')) prevSlug=null; },700);
}
// mark the clicked card cover for the morph
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-slug]');
  if(a){ document.querySelectorAll('[data-cover]').forEach(c=>c.style.viewTransitionName=''); const c=a.querySelector('.cover'); const h=app.querySelector('.phero'); if(c){ c.style.viewTransitionName='hero-cover'; } else if(h){ h.style.viewTransitionName='hero-cover'; } }
});
addEventListener('hashchange',navigate);

/* nav indicator */
function moveInd(){
  const wrap=document.getElementById('links'), ind=wrap.querySelector('.ind'), a=wrap.querySelector('a[aria-current="page"]');
  if(!a||a.offsetParent===null){ind.style.width='0px';return}
  ind.style.width=a.offsetWidth+'px'; ind.style.transform=`translateX(${a.offsetLeft}px)`;
}
addEventListener('resize',moveInd);
document.fonts && document.fonts.ready.then(moveInd);

/* reveal: elements below the fold start slightly lower, always visible */
let io;
function setupReveal(){
  if(io) io.disconnect(); if(reduce) return;
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.remove('pre');io.unobserve(en.target)}}),{rootMargin:'0px 0px -8% 0px'});
  const vh=innerHeight;
  app.querySelectorAll('.rv').forEach((el,i)=>{ if(el.getBoundingClientRect().top>vh*0.92){ el.classList.add('pre'); el.style.transitionDelay=((i%3)*70)+'ms'; io.observe(el);} });
}

/* home: selection box + contrast checker */
function setupHome(){
  const box=document.getElementById('selbox'); if(!box) return;
  const btns=[...document.querySelectorAll('#stack .ds-btn')];
  const names=['button/primary','button/primary-pressed','button/disabled'];
  const sizes=['padding/medium · 12','padding/medium · 12','state/disabled'];
  let k=0;
  const place=()=>{const b=btns[k]; box.style.transform=`translateY(${b.offsetTop}px)`; document.getElementById('selname').textContent=names[k]; document.getElementById('selsize').textContent=sizes[k];};
  place(); if(!reduce) timers.push(setInterval(()=>{k=(k+1)%3;place()},2200));
  const sws=[...document.querySelectorAll('.sw')];
  const setC=c=>{
    sws.forEach(s=>s.setAttribute('aria-pressed',s.dataset.c===c));
    const r=contrast('#ffffff',c);
    const s=document.getElementById('sample'); s.style.background=c; s.style.color='#ffffff';
    document.getElementById('pair').textContent='#FFFFFF on '+c.toUpperCase();
    count(document.getElementById('ratio'),r,1,':1');
    const t=[['AA text',4.5],['AA large',3],['AAA text',7]];
    document.getElementById('badges').innerHTML=t.map(([n,v])=>`<span class="badge ${r>=v?'pass':'fail'}">${r>=v?'✓':'✕'} ${n}</span>`).join('');
  };
  sws.forEach(s=>s.addEventListener('click',()=>setC(s.dataset.c)));
  setC('#0b7a55');
  let ci=0; if(!reduce) timers.push(setInterval(()=>{ if(document.querySelector('.contrast:hover')) return; ci=(ci+1)%sws.length; setC(sws[ci].dataset.c)},3400));
}
function lum(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
function contrast(a,b){const A=lum(a),B=lum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)}
function count(el,to,dec=0,suf=''){
  const from=parseFloat(el.dataset.v||0); el.dataset.v=to; const t0=performance.now(), d=reduce?1:700;
  const step=t=>{const p=Math.min(1,(t-t0)/d), e=1-Math.pow(1-p,3); el.textContent=(from+(to-from)*e).toFixed(dec)+suf; if(p<1) requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

/* work filter with animated layout */
function setupWork(){
  const g=document.getElementById('wgrid'); if(!g) return;
  document.querySelectorAll('.fchip').forEach(b=>b.addEventListener('click',()=>{
    const f=b.dataset.f;
    const apply=()=>{document.querySelectorAll('.fchip').forEach(x=>x.setAttribute('aria-pressed',x===b));
      g.querySelectorAll('.pcard').forEach(c=>c.classList.toggle('gone',f!=='all'&&!c.dataset.cat.split(' ').includes(f)))};
    const cards=[...g.querySelectorAll('.pcard')];
    if(document.startViewTransition&&!reduce){cards.forEach(c=>c.style.viewTransitionName='c-'+c.dataset.slug);
      const t=document.startViewTransition(apply); t.finished.finally(()=>cards.forEach(c=>c.style.viewTransitionName=''));}
    else apply();
  }));
}

/* prototypes */
function setupProtos(){
  app.querySelectorAll('.proto').forEach(root=>{
    const imgs=[...root.querySelectorAll('.scr img')], btns=[...root.querySelectorAll('.steps button')], dev=root.querySelector('.device');
    const dur=parseFloat(root.dataset.dur)*1000; let i=0, t=null;
    root.style.setProperty('--dur',dur+'ms');
    const show=n=>{ if(n===i) return; imgs[i].classList.remove('on'); imgs[i].classList.add('out'); const old=imgs[i]; setTimeout(()=>old.classList.remove('out'),700);
      i=n; imgs[i].classList.add('on'); btns.forEach((b,k)=>b.setAttribute('aria-current',k===i)); restartBar(); };
    const restartBar=()=>{const bar=btns[i].querySelector('.bar i'); bar.style.animation='none'; void bar.offsetWidth; bar.style.animation='';};
    const loop=()=>{clearTimeout(t); if(reduce) return; t=setTimeout(()=>{ if(!root.classList.contains('paused')) show((i+1)%imgs.length); loop(); },dur)};
    btns.forEach((b,k)=>b.addEventListener('click',()=>{show(k);loop()}));
    dev.addEventListener('click',()=>{show((i+1)%imgs.length);loop()});
    root.addEventListener('mouseenter',()=>root.classList.add('paused')); root.addEventListener('mouseleave',()=>{root.classList.remove('paused');restartBar();loop()});
    const vis=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){restartBar();loop()} else clearTimeout(t) }),{threshold:.35});
    vis.observe(root); timers.push(setInterval(()=>{ if(!document.body.contains(root)){clearTimeout(t);vis.disconnect()} },1500));
  });
}

/* token playground */
const BRANDS={green:['#0b7a55','#075e41','green-600','green-700'],blue:['#0b6bcb','#0855a3','blue-600','blue-700'],violet:['#5b3fd6','#4630ad','violet-600','violet-700']};
function setupTokens(){
  const tp=document.getElementById('tp'); if(!tp) return;
  const st={theme:'light',brand:'green',radius:'999',density:'comfortable'};
  const apply=()=>{
    const b=BRANDS[st.brand]; tp.style.setProperty('--b',b[0]); tp.style.setProperty('--b2',b[1]);
    tp.classList.toggle('dark',st.theme==='dark');
    tp.style.setProperty('--rad',st.radius+'px');
    tp.style.setProperty('--pad',st.density==='compact'?'8px':'12px'); tp.style.setProperty('--gap',st.density==='compact'?'8px':'14px');
    const bg=st.theme==='dark'?'#141416':'#ffffff';
    document.getElementById('tokOut').innerHTML=
      `<b>color-bg-primary</b> → ${b[2]} <span class="sq" style="background:${b[0]}"></span>${b[0]}<br>`+
      `<b>color-bg-surface</b> → ${st.theme==='dark'?'neutral-950':'neutral-0'} <span class="sq" style="background:${bg};box-shadow:0 0 0 1px var(--line)"></span>${bg}<br>`+
      `<b>radius-button</b> → ${st.radius==='999'?'radius-full':'radius-'+st.radius} · ${st.radius==='999'?'999px':st.radius+'px'}<br>`+
      `<b>spacing-button-y</b> → ${st.density==='compact'?'space-2 · 8px':'space-3 · 12px'}`;
  };
  document.querySelectorAll('#tpDemo .seg').forEach(seg=>seg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    st[seg.dataset.k]=btn.dataset.v; seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===btn)); apply();
  })));
  tp.querySelector('.sw2').addEventListener('click',e=>{const s=e.currentTarget;s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true')});
  apply();
}

/* funnel */
function setupFunnel(){
  const f=document.getElementById('funnel'); if(!f) return;
  const run=()=>{f.querySelectorAll('.fill').forEach(x=>{x.style.transition='none';x.style.width='0';void x.offsetWidth;x.style.transition='';x.style.width=x.dataset.w+'%'});
    f.querySelectorAll('[data-n]').forEach(n=>{n.dataset.v=0;count(n,+n.dataset.n)});};
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){run();o.disconnect()}}),{threshold:.4}); o.observe(f);
  f.querySelector('#replay').addEventListener('click',run);
}

/* contact copy */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function setupContact(){
  app.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
    const el=document.getElementById(b.dataset.copy); const v=el.textContent.trim(); const what=b.dataset.copy==='email'?'Email':'Number';
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(what+' selected. Press copy.')};
    try{navigator.clipboard.writeText(v).then(()=>toast(what+' copied'),sel)}catch(e){sel()}
  }));
}

/* theme toggle */
const tb=document.getElementById('themeBtn');
const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
try{const s=localStorage.getItem('aa-theme'); if(s) document.documentElement.setAttribute('data-theme',s);}catch(e){}
const curTheme=()=>document.documentElement.getAttribute('data-theme')||(sysDark()?'dark':'light');
const syncSwitch=()=>tb.setAttribute('aria-checked',curTheme()==='dark');
syncSwitch(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncSwitch);
tb.addEventListener('click',()=>{
  const nx=curTheme()==='dark'?'light':'dark';
  const go=()=>{document.documentElement.setAttribute('data-theme',nx);syncSwitch()};
  if(document.startViewTransition&&!reduce){ const R=document.documentElement; R.classList.add('vt-theme'); document.startViewTransition(go).finished.finally(()=>R.classList.remove('vt-theme')); } else go();
  try{localStorage.setItem('aa-theme',nx)}catch(e){}
});

render();
})();
